name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test consonant length planner
        run: dotnet run --project tests/ConsonantLength.Tests/ConsonantLength.Tests.csproj -c Release

      - name: Test CVVC expression editor
        run: dotnet run --project tests/ExpressionEditor.Tests/ExpressionEditor.Tests.csproj -c Release

  upstream-compat:
    # Compiles both plugins against the newest official OpenUtau.Core.dll.
    # Newer OpenUtau releases target .NET 10, the shipped plugin target is net8.0,
    # so this job builds the net10.0 flavor only (source level API check).
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch OpenUtau.Core.dll from the latest OpenUtau release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'OpenUtau-Plugins-CI' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/openutau/OpenUtau/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match 'win.*x64.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'No OpenUtau win-x64 zip asset found.' }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile openutau.zip
          Expand-Archive openutau.zip -DestinationPath openutau -Force
          $core = Get-ChildItem openutau -Recurse -Filter 'OpenUtau.Core.dll' | Select-Object -First 1
          if (-not $core) { throw 'OpenUtau.Core.dll not found in the release package.' }
          New-Item -ItemType Directory -Force lib | Out-Null
          Copy-Item $core.FullName lib/OpenUtau.Core.dll

      - name: Compile consonant length plugin (net10 flavor)
        run: dotnet build src/OpenUtau.Plugin.ConsonantLength/OpenUtau.Plugin.ConsonantLength.csproj -c Release -p:PluginTargetFrameworks=net10.0 -p:OpenUtauCorePath="${{ github.workspace }}/lib/OpenUtau.Core.dll"

      - name: Compile CVVC expression plugin (net10 flavor)
        run: dotnet build src/OpenUtau.Plugin.CVVCExpression/OpenUtau.Plugin.CVVCExpression.csproj -c Release -p:PluginTargetFrameworks=net10.0 -p:OpenUtauCorePath="${{ github.workspace }}/lib/OpenUtau.Core.dll"
